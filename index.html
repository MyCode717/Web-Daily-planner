<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Web Daily Planner</title>
</head>
<body>
    <header>
        <nav>
            <img src="" alt="">
            <p>NAMA USER</p>
            <p>DAILY PLANNER APPS</p>
            <div class="setting"></div>
            <div class="log-out"></div>
        </nav>
    </header>
    <main>
        <section>
            <div class="sec-left">
                <div class="three-priorities">
                    <p>TOP 3 PRIORITIES</p>
                </div>
                <div class="to-do-list">
                    <p>TO DO LIST</p>
                </div>
            </div>
            <div class="sec-right">
                <div class="google-calendar">

                </div>
                <div class="col-message">
                    <div class="for-tommorow">
                        <p>FOR TOMMOROW :</p>
                    </div>
                    <div class="notes">
                        <p>NOTES :</p>
                    </div>
                </div>
            </div>
        </section>

    <script src="index.js"></script>

</html>
